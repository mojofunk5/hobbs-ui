name: Build and Deploy

on: push

jobs:
  # Always runs (no trigger-level path filter) - deliberately, so this workflow always reports a
  # status for every commit. A trigger-level paths-ignore looks equivalent but isn't: this repo's
  # branch protection requires the "build" check (see docs/ai-working-agreement.md), and if the whole
  # workflow never triggers, no status is ever posted for that check - GitHub leaves it stuck
  # "waiting to be reported" forever and blocks merging. A *job* that's conditionally skipped via
  # `if:`, by contrast, still reports a "skipped" status, which GitHub counts as passing for a
  # required check. Same pattern used in hobbs's build.yml, for consistency between the two repos.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Hand-rolled rather than dorny/paths-filter's predicate-quantifier: every, after that option
      # turned out not to mean what it looked like it meant - it checks "does every declared PATTERN
      # have at least one matching file", not "does every changed FILE match a pattern". A single doc
      # file satisfies both '**/*.md' and 'docs/**' on its own, so a commit that also touched a real
      # code file alongside one doc file would get wrongly classified docs-only and have its build
      # silently skipped - confirmed the hard way on hobbs (see hobbs's docs/CI_PERFORMANCE.md and
      # this repo's docs/ci-performance.md), no PR here happened to hit it in practice but the same
      # bug was present. This loop checks every changed file individually against the docs patterns
      # instead, verified locally across docs-only/mixed/code-only/nested-docs-path/false-positive-
      # filename cases before shipping.
      - id: check
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*) ;;
              *) docs_only=false ;;
            esac
          done < <(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get update -y && sudo apt-get install -y lcov

      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info -o coverage/html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: lcov-coverage-report
          path: coverage/html

      # badge-maker is shields.io's own badge-rendering library (published on npm, MIT) - used
      # directly via npx rather than a third-party wrapper Action, so there's no extra unreviewed
      # code in the supply chain beyond the tool shields.io itself uses. There's no first-party lcov
      # equivalent of hobbs's cicirello/jacoco-badge-generator, so this reads the percentage out of
      # lcov's own --summary output instead.
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/master'
        run: |
          PCT=$(lcov --summary coverage/lcov.info 2>&1 | grep -oP 'lines\.*: \K[0-9.]+')
          COLOR=$(awk -v p="$PCT" 'BEGIN { if (p >= 80) print "#4c1"; else if (p >= 60) print "#dfb317"; else print "#e05d44" }')
          mkdir -p .github/badges
          npx --yes badge-maker "coverage" "${PCT}%" "$COLOR" > .github/badges/coverage.svg

      # Same racy-merge reasoning as hobbs's build.yml: two merges landing on master close together
      # race here, so retry with a rebase+push loop, and continue-on-error since a stale badge is
      # cosmetic and must never block deploy (which needs: build).
      - name: Commit coverage badge
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          if [[ $(git status --porcelain .github/badges) ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/badges
            git commit -m "Update coverage badge [skip ci]"
            for i in 1 2 3; do
              git push && break
              git fetch origin master
              git rebase origin/master
            done
          fi

      # --no-wasm-dry-run skips an advisory wasm-compatibility check that runs alongside the real
      # JS compile even though this build never ships wasm (no --wasm flag) - verified locally that
      # main.dart.js comes out byte-for-byte identical with or without it; only flutter_bootstrap.js's
      # informational build-target list changes (one inert placeholder entry for the skipped wasm
      # target). ~38s -> ~26s locally (~33% faster) for zero output difference.
      - run: flutter build web --release --no-wasm-dry-run

      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/web

      # Each deploy lands in its own directory named after the commit SHA, and "current" is a
      # relative symlink (releases/<sha>, not an absolute host path) swapped to point at it -
      # relative so it also resolves correctly from inside the Caddy container, which only sees the
      # mounted directory's own path (/srv/hobbs-ui), not the host's (/opt/hobbs-ui). Rolling back is
      # just repointing the symlink at an older release directory - no rebuild needed.
      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          echo "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new)
          SHA="${GITHUB_SHA::7}"
          # shellcheck disable=SC2029  # deliberate: $SHA only exists on the runner, expand it locally
          ssh "${SSH_OPTS[@]}" root@213.171.213.90 "mkdir -p /opt/hobbs-ui/releases/$SHA"
          scp "${SSH_OPTS[@]}" -r build/web/* "root@213.171.213.90:/opt/hobbs-ui/releases/$SHA/"
          # shellcheck disable=SC2029  # deliberate: $SHA only exists on the runner, expand it locally
          ssh "${SSH_OPTS[@]}" root@213.171.213.90 \
            "cd /opt/hobbs-ui && ln -sfn releases/$SHA current && ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf"
