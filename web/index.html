<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hobbs_ui">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hobbs_ui</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Covers the page until Flutter's first frame paints over it - without this, main.dart.js's
       download+parse+execute time (no service worker precaching it, no content-hashed filename to
       cache long-term - see hobbs-ui's README) shows as a plain blank white screen, which reads as
       broken rather than loading, especially right after a fresh deploy. */
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f3fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #49454f;
    }
    #loading-splash .spinner {
      width: 32px;
      height: 32px;
      margin-right: 12px;
      border: 3px solid #d8d4e8;
      border-top-color: #4a4468;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="spinner"></div>
    <span>Loading Hobbs&hellip;</span>
  </div>

  <!-- No service worker: it's deprecated upstream, was flaky here (a failed registration fell
       back to a plain <script> tag only after a hard-coded 4s timeout), and buys nothing since the
       web build isn't content-hashed and Caddy already serves it with Cache-Control: no-cache -
       every load is a fresh fetch either way, so the extra machinery was pure overhead. -->
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
